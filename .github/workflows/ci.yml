name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to create'
        required: false

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - uses: oven-sh/setup-bun@v2

      - name: Install javascript dependencies
        run: |
          cd themes/default
          bun install --frozen-lockfile

      - name: Run build
        run: dotnet build toki.slnx -c Release

      - name: Run tests
        run: dotnet test toki.slnx -c Release --no-build --verbosity normal

      - name: Release
        shell: pwsh
        run: |
          dotnet publish src/toki -c Release -o ./publish
          mkdir symbols
          mv publish/toki.pdb symbols/

      - name: Pack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $variant = "${{ runner.os }}-${{ runner.arch }}".ToLower()
          mkdir artifact
          7z a ./artifact/toki-$variant-${{ github.ref_name }}.7z ./publish
          7z a ./artifact/toki-$variant-${{ github.ref_name }}.symbols.7z ./symbols

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.version != '' && matrix.os == 'windows-latest' }}
        with:
          name: packages
          path: artifact
          if-no-files-found: error


  release:
    if: ${{ github.event.inputs.version != '' }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.PACKAGE_VERSION }}
          tag_name: v${{ env.PACKAGE_VERSION }}
          generate_release_notes: true
          append_body: true
          body: |
            ### [Placeholder]
          draft: true
          prerelease: ${{ env.IS_STABLE_BUILD == 'false' }} # Example: v3.1.0-beta
          files: packages/*
