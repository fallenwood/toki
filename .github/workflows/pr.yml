name: PR

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    outputs:
      package_version: ${{ steps.build_script.outputs.package_version }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - uses: oven-sh/setup-bun@v2

      - name: Install javascript dependencies
        run: |
          cd themes/default
          bun install --frozen-lockfile

      - name: Run build
        run: dotnet build toki.slnx -c Release

      - name: Run tests
        run: dotnet test toki.slnx -c Release --no-build --verbosity normal

      - name: Run publish
        run: dotnet publish toki.slnx -c Release -o ./publish
