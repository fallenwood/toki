{% extends "base.html" %}

{% block content %}
<section class="flex flex-col gap-6" id="search-page" data-search-page>
  <header class="flex flex-col gap-2">
    <h1 class="text-3xl font-bold tracking-tight flex items-center gap-2">
      <i data-lucide="search"></i> Search
    </h1>
    <p class="text-base-content/70">Start typing to search posts and pages.</p>
  </header>
  <div class="form-control w-full">
    <label class="input input-bordered flex items-center gap-2" for="search-input-page">
      <i data-lucide="search" class="w-4 h-4 opacity-60"></i>
      <input id="search-input-page" type="search" placeholder="Search…" class="grow bg-transparent" autocomplete="off" />
    </label>
  </div>
  <div id="search-results-summary" class="text-sm text-base-content/70 hidden"></div>
  <div id="search-results-page" class="grid gap-4" aria-live="polite"></div>
</section>
{% endblock %}
